name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: AgendaAcademica
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar o Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Gerar o APK (debug)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: AgendaAcademica/app/build/outputs/apk/debug/app-debug.apk
